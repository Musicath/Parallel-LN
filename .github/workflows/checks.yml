name: Source and data checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install matched CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.0+cpu torchvision==0.19.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          python -m pip install -r requirements-smoke.txt
          python -m pip check
      - name: Candidate checks (no dataset download or training)
        run: python tools/validate_candidate.py
